name: build-mirror

# Public build-only repo. The private source (worldneedme/mirror) is fetched with a
# read-only deploy key, so the source is never made public. The installer is
# published as a release asset in the PRIVATE source repo, not here.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private source branch, tag or commit to build
        required: true
        default: main
        type: string
      publish:
        description: 上传安装包到 mirror 的 Releases
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mirror-build
  cancel-in-progress: false

jobs:
  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: win
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: worldneedme/mirror
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Test mirror-core
        run: cargo test --manifest-path crates/mirror-core/Cargo.toml

      - name: Verify mirror-core dependency boundary
        run: |
          if cargo tree --manifest-path crates/mirror-core/Cargo.toml | grep -E 'tauri|windows'; then
            echo "mirror-core must not depend on tauri or windows"
            exit 1
          fi

  build:
    needs: core-tests
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: win
    env:
      UXPLAY_TAG: "2.0.0.1736"
      SCRCPY_VERSION: "4.1"
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: worldneedme/mirror
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: win/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "win/src-tauri -> target"

      - name: Cache runtime archives
        uses: actions/cache@v4
        with:
          path: win/.runtime-cache
          key: runtimes-uxplay-${{ env.UXPLAY_TAG }}-scrcpy-${{ env.SCRCPY_VERSION }}

      - name: Fetch uxplay + scrcpy runtimes
        run: ./scripts/fetch-runtimes.ps1 -UxplayTag $env:UXPLAY_TAG -ScrcpyVersion $env:SCRCPY_VERSION

      - name: Install npm dependencies
        run: npm ci

      - name: Generate app icons from assets/logo.svg
        run: npx tauri icon assets/logo.svg

      - name: Prepare frontend for Clippy
        run: npm run build

      - name: Clippy audit (warnings denied)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --release -- -D warnings

      - name: Build installer
        run: npm run tauri build

      - name: Smoke test bundled runtimes
        run: |
          $release = "src-tauri/target/release"
          foreach ($file in @("mirror-win.exe", "bin/uxplay-windows.exe", "bin/platforms/qwindows.dll", "bin/scrcpy/scrcpy.exe", "bin/scrcpy/adb.exe")) {
            if (-not (Test-Path (Join-Path $release $file))) { throw "missing in release output: $file" }
          }
          & "$release/bin/scrcpy/scrcpy.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "scrcpy --version failed" }
          & "$release/bin/scrcpy/adb.exe" version
          if ($LASTEXITCODE -ne 0) { throw "adb version failed" }
          $installer = Get-ChildItem "$release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not produced" }
          "installer: $($installer.Name) ($([math]::Round($installer.Length / 1MB, 1)) MB)"
          "installer-bytes: $($installer.Length)"

      - name: Install and start packaged app (smoke gate)
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'mirror-installed-smoke'
          $installation = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -WindowStyle Hidden -PassThru
          if (-not $installation.WaitForExit(60000)) { throw 'Installation timed out' }
          if ($installation.ExitCode -ne 0) { throw "Installation failed: $($installation.ExitCode)" }
          $exe = Join-Path $installDir 'mirror-win.exe'
          if (-not (Test-Path $exe)) { throw 'Installed executable missing' }
          $expected = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $actual = (Get-Item $exe).VersionInfo.ProductVersion
          if ($actual -ne $expected) { throw "Installed version mismatch: $actual != $expected" }
          foreach ($relative in @('bin/uxplay-windows.exe', 'bin/platforms/qwindows.dll', 'bin/scrcpy/scrcpy.exe', 'bin/scrcpy/adb.exe')) {
            if (-not (Test-Path (Join-Path $installDir $relative))) { throw "Installed resource missing: $relative" }
          }
          $app = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru
          try {
            $hasWindow = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Milliseconds 500
              $app.Refresh()
              if ($app.HasExited) { throw "Installed app exited during startup: $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne [IntPtr]::Zero) { $hasWindow = $true; break }
            }
            if (-not $hasWindow) { throw 'Installed app did not create a window' }
            Start-Sleep -Seconds 5
            $app.Refresh()
            if ($app.HasExited) { throw 'Installed app exited during stability check' }
            Write-Host "INSTALL/START PASS version=$actual pid=$($app.Id) title=$($app.MainWindowTitle)"
          } finally {
            if (-not $app.HasExited) {
              $null = $app.CloseMainWindow()
              if (-not $app.WaitForExit(5000)) { Stop-Process -Id $app.Id -Force }
            }
          }
          $global:LASTEXITCODE = 0

      - name: UI screenshots (demo mode, headless Chrome)
        run: ./scripts/ci-screenshots.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: win/screenshots/*.png
          retention-days: 14

      - name: Publish installer to the private source repo (release asset)
        if: ${{ inputs.publish }}
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.MIRROR_RELEASES_TOKEN }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $installer = Get-ChildItem "win/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "installer missing" }
          $tag = "build-${{ github.run_number }}"
          gh release create $tag $installer.FullName -R worldneedme/mirror --target $sha --prerelease `
            --title "$tag ($($installer.Name))" `
            --notes "Built from $sha by worldneedme/mirror-build run ${{ github.run_id }}."
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          "published $tag : $($installer.Name) ($([math]::Round($installer.Length / 1MB, 1)) MB)"
